name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm test -- --watch=false
      - working-directory: app
        run: npm run build
      - name: Playwright smoke (routes render; MorphCharts falls back without WebGPU)
        working-directory: app
        run: |
          node e2e/static-server.mjs dist/app/browser 4173 &
          sleep 1
          CHROMIUM_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" || true
          npx playwright install chromium
          node e2e/smoke-screens.mjs http://localhost:4173 test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: app/test-results

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: api
        run: uv sync --extra dev
      - working-directory: api
        run: uv run pytest -q
