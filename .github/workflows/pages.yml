name: Deploy site and labs app to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install and build the Angular app
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Assemble the site (static root + /app/)
        run: |
          mkdir -p _site/app
          for f in index.html 404.html privacy.html robots.txt sitemap.xml .nojekyll styles.css main.js globe.js hero3d.js i18n.js pipeline-viz.js; do
            [ -e "$f" ] && cp "$f" _site/
          done
          cp -R assets _site/assets
          cp -R app/dist/app/browser/. _site/app/
          cp app/dist/app/browser/index.html _site/app/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
