<header class="nav">
  <a class="brand" routerLink="/" aria-label="RichOS home">
    <img src="kongs-mark.png" alt="" width="28" height="28">
    <span>Rich<em>OS</em></span>
  </a>
  <nav aria-label="Pages">
    @for (link of links; track link.label) {
      @if (link.children) {
        <!-- routerLinkActive on the <details> highlights the group while any child route is open. -->
        <details class="group" routerLinkActive="open-route" #menu>
          <summary><app-nav-icon [name]="link.icon" />{{ link.label }}</summary>
          <div class="menu glass">
            @for (child of link.children; track child.path) {
              <a [routerLink]="child.path" routerLinkActive="active" (click)="menu.open = false"><app-nav-icon [name]="child.icon" />{{ child.label }}</a>
            }
          </div>
        </details>
      } @else {
        <a [routerLink]="link.path" routerLinkActive="active"><app-nav-icon [name]="link.icon" />{{ link.label }}</a>
      }
    }
  </nav>
  <a class="site-link" href="/">Back to site ↗</a>
</header>

<main class="page" appRouteTransition>
  <router-outlet />
</main>
