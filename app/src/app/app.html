<header class="nav">
  <a class="brand" routerLink="/" aria-label="Kong's Labs home">
    <img src="kongs-mark.png" alt="" width="28" height="28">
    <span>Kong's <em>Labs</em></span>
  </a>
  <nav aria-label="Pages">
    @for (link of links; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
    }
  </nav>
  <a class="site-link" href="/">Back to site ↗</a>
</header>

<main class="page" [appRouteTransition]="wipe">
  <router-outlet />
</main>

<div #wipe class="wipe" aria-hidden="true"></div>
