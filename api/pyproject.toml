[project]
name = "kong-labs-api"
version = "0.1.0"
description = "FastAPI + DuckDB service behind the Kong's Labs Angular app (merchandise, Ares-style reports, Human Atlas)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
bigquery = ["google-cloud-bigquery>=3.25", "db-dtypes>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
